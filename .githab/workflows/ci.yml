name: Node.js CI Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Download dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test